[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/pfedan/gummiband"

[workspace.dependencies]
gummiband-core = { path = "crates/gummiband-core" }
gummiband-kicad = { path = "crates/gummiband-kicad" }
gummiband-place = { path = "crates/gummiband-place" }
gummiband-app = { path = "crates/gummiband-app" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The maths of gummiband_core::math, see there. Default features only: `arch` uses the hardware for
# sqrt, fma and rint, which IEEE 754 defines to the last bit; never the `unstable` ones.
libm = "0.2.16"
rayon = "1"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
