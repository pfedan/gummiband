[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pfedan/gummiband"

[workspace.dependencies]
gummiband-core = { path = "crates/gummiband-core" }
gummiband-kicad = { path = "crates/gummiband-kicad" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
