[package]
name = "gummiband-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "MCP server (stdio) that lets AI agents load, route, check and render KiCad boards with Gummiband"

[[bin]]
name = "gummiband-mcp"
path = "src/main.rs"

[dependencies]
gummiband-core.workspace = true
gummiband-kicad.workspace = true
gummiband-place.workspace = true
anyhow.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
base64 = "0.23"
