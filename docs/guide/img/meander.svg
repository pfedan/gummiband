<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/></marker><marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/></marker></defs>
<rect x="0.5" y="0.5" width="819" height="299" rx="10" fill="#ffffff" stroke="#dadce0"/>
<text x="20.0" y="30.0" font-size="14" fill="#202124" text-anchor="start" font-weight="bold">Length tuning: a meander on the straight part of a track</text>
<path d="M 30.0 150.0 L 180.0 150.0" stroke="#c8373a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 180 150 L 180 119.0 A 15.0 15.0 0 0 1 210 119.0 L 210 150 L 210 181.0 A 15.0 15.0 0 0 0 240 181.0 L 240 150 L 240 119.0 A 15.0 15.0 0 0 1 270 119.0 L 270 150 L 270 181.0 A 15.0 15.0 0 0 0 300 181.0 L 300 150 L 300 119.0 A 15.0 15.0 0 0 1 330 119.0 L 330 150 L 330 181.0 A 15.0 15.0 0 0 0 360 181.0 L 360 150 L 360 119.0 A 15.0 15.0 0 0 1 390 119.0 L 390 150 L 390 181.0 A 15.0 15.0 0 0 0 420 181.0 L 420 150" stroke="#c8373a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 420.0 150.0 L 580.0 150.0" stroke="#c8373a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="160.0" y1="150.0" x2="440.0" y2="150.0" stroke="#5f6368" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="450.0" y="142.0" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">base line</text>
<line x1="150.0" y1="150.0" x2="150.0" y2="104.0" stroke="#5f6368" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="140.0" y="127.0" font-size="11" fill="#5f6368" text-anchor="end" font-weight="normal">height</text>
<text x="140.0" y="141.0" font-size="11" fill="#5f6368" text-anchor="end" font-weight="normal">(--tune-amplitude)</text>
<line x1="210.0" y1="218.0" x2="240.0" y2="218.0" stroke="#5f6368" stroke-width="1.2" marker-end="url(#arr)" marker-start="url(#arr-s)"/>
<text x="225.0" y="238.0" font-size="11" fill="#5f6368" text-anchor="start" font-weight="normal">air between legs (--tune-spacing)</text>
<text x="30.0" y="270.0" font-size="12" fill="#5f6368" text-anchor="start" font-weight="normal">Bumps go to the side with more room and are lowered evenly until the net gains exactly what it lacks.</text>
<text x="30.0" y="288.0" font-size="12" fill="#5f6368" text-anchor="start" font-weight="normal">Written as a KiCad tuning pattern, so it can be edited and tuned again in KiCad.</text>
